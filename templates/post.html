{% extends "base.html" %}

{% block content %}

<div class="max-w-4xl mx-auto w-full min-w-0">

  <div class="bg-black/25 
              backdrop-blur-sm
              border border-blue-500/20
              rounded-2xl 
              p-4 sm:p-8 md:p-12 
              shadow-2xl
              min-w-0
              max-w-full
              overflow-hidden">

    <article class="prose prose-invert max-w-none min-w-0 w-full
                prose-p:text-gray-200
                prose-headings:text-white
                prose-strong:text-white
                prose-a:text-blue-400
                prose-hr:border-neutral-800">


        <header>

        <script>
        window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: {
            fontCache: 'global'
        }
        };
        </script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>


            <h1 class="mb-3 text-3xl md:text-4xl font-semibold tracking-tight text-white">
                {{ page.title }}
            </h1>

            {% if page.date %}
            <p class="text-sm text-gray-400">
                Published on: {{ page.date }}
            </p>
            {% endif %}

            {% if page.tags %}
            <div class="mt-3 flex flex-wrap gap-2">
                {% for tag in page.tags %}
                <a class="badge badge-outline badge-sm border-neutral-600 text-gray-300"
                   href="/tags/{{ tag }}.html">
                   {{ tag }}
                </a>
                {% endfor %}
            </div>
            {% endif %}

            <hr class="my-6 border-neutral-800">
        </header>

        {{ content | safe }}

    </article>

  </div>

</div>

<script>
(() => {
  document.querySelectorAll(".prose table").forEach((table) => {
    if (!table.parentElement.classList.contains("table-wrapper")) {
      const wrapper = document.createElement("div");
      wrapper.className = "table-wrapper my-6 w-full max-w-full overflow-x-auto rounded-xl border border-white/10 bg-black/40 p-3 shadow-inner";
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    }
  });
})();
</script>

{% endblock %}
