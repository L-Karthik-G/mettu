    <script>
      function updateCountdown() {
        const worldCup = new Date("2026-06-11T00:00:00");
        const now = new Date();
        const diff = worldCup - now;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById("countdown").textContent = `${days}d ${hours}h ${mins}m ${secs}s`;
      }
      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>

    <script>
      let raceDate;
      fetch("https://api.jolpi.ca/ergast/f1/2026.json")
      .then(res => res.json())
      .then(data => {
        const races = data.MRData.RaceTable.Races;
        const now = new Date();
        const next = races.find(r => new Date(`${r.date}T${r.time}`) > now);
        if (!next) return;
        raceDate = new Date(`${next.date}T${next.time}`);
        document.getElementById("f1-race-name").textContent = next.raceName;
        document.getElementById("f1-location").textContent =
          `${next.Circuit.Location.locality}, ${next.Circuit.Location.country}`;
      });

      function updateF1Countdown() {
        if (!raceDate) return;
        const now = new Date();
        const diff = raceDate - now;
        if (diff <= 0) {
          document.getElementById("f1-countdown").textContent = "Race Underway 🏁";
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById("f1-countdown").textContent = `${days}d ${hours}h ${mins}m ${secs}s`;
      }
      setInterval(updateF1Countdown, 1000);
    </script>

    <script>
      const TOTAL_POKEMON = 649;
      let pkScore = 0, pkStreak = 0, pkAnswer = null, pkAnswered = false;
      const pkSeen = new Set();

      // All tiles: yellow fill with blue border
      const tileStyles = [
        {
          bg: 'rgba(250,204,21,0.15)',
          border: '1.5px solid rgba(96,165,250,0.75)',
          color: '#fef08a',
          hoverBg: 'rgba(250,204,21,0.28)',
        },
        {
          bg: 'rgba(250,204,21,0.15)',
          border: '1.5px solid rgba(96,165,250,0.75)',
          color: '#fef08a',
          hoverBg: 'rgba(250,204,21,0.28)',
        },
      ];

      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = randInt(0, i);
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      async function fetchPokemonName(id) {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        const data = await res.json();
        return data.name.charAt(0).toUpperCase() + data.name.slice(1);
      }

      async function nextPokemon() {
        pkAnswered = false;
        document.getElementById('pk-next-btn').style.display = 'none';
        document.getElementById('pk-feedback').textContent = '';

        // Instantly snap to black — no transition so no colour flash between rounds
        const spriteReset = document.getElementById('pk-sprite');
        spriteReset.style.transition = 'none';
        spriteReset.style.filter = 'brightness(0) drop-shadow(0 0 20px rgba(255,220,0,0.3))';

        // Pick answer pokemon (avoid repeats if possible)
        let answerId;
        do { answerId = randInt(1, TOTAL_POKEMON); } while (pkSeen.has(answerId) && pkSeen.size < TOTAL_POKEMON);
        if (pkSeen.size >= TOTAL_POKEMON) pkSeen.clear();
        pkSeen.add(answerId);
        pkAnswer = answerId;

        // Pick 3 wrong options
        const wrongIds = new Set();
        while (wrongIds.size < 3) {
          const w = randInt(1, TOTAL_POKEMON);
          if (w !== answerId) wrongIds.add(w);
        }

        // Load sprite
        const sprite = document.getElementById('pk-sprite');
        sprite.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${answerId}.png`;

        // Fetch all names in parallel
        const ids = [answerId, ...wrongIds];
        const names = await Promise.all(ids.map(fetchPokemonName));
        const choices = shuffle(names.map((name, i) => ({ name, correct: i === 0 })));

        // Render choices
        const choicesEl = document.getElementById('pk-choices');
        choicesEl.innerHTML = '';
        choices.forEach((choice, idx) => {
          const tile = tileStyles[idx % 2];
          const btn = document.createElement('button');
          btn.textContent = choice.name;
          btn.dataset.correct = choice.correct;
          btn.dataset.tileIdx = idx % 2;
          btn.style.cssText = `
            background: ${tile.bg};
            color: ${tile.color};
            border: ${tile.border};
            border-radius: 12px;
            padding: 13px 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-shadow: 0 1px 6px rgba(0,0,0,0.9);
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
          `;
          btn.onmouseover = () => { if (!pkAnswered) btn.style.background = tile.hoverBg; };
          btn.onmouseout = () => { if (!pkAnswered) btn.style.background = tile.bg; };
          btn.onclick = () => handleAnswer(btn, choice.correct);
          choicesEl.appendChild(btn);
        });
      }

      function handleAnswer(btn, isCorrect) {
        if (pkAnswered) return;
        pkAnswered = true;

        // Reveal pokemon with brightness ramp
        const sprite = document.getElementById('pk-sprite');
        sprite.style.transition = 'filter 0.6s ease';
        sprite.style.filter = 'brightness(0.3) drop-shadow(0 0 20px rgba(255,220,0,0.5))';
        setTimeout(() => {
          sprite.style.filter = 'brightness(0.6) drop-shadow(0 0 25px rgba(255,220,0,0.6))';
          setTimeout(() => {
            sprite.style.filter = 'brightness(1) drop-shadow(0 0 30px rgba(255,220,0,0.8))';
          }, 200);
        }, 150);

        // Highlight correct green, wrong red
        document.querySelectorAll('#pk-choices button').forEach(b => {
          b.style.cursor = 'default';
          if (b.dataset.correct === 'true') {
            b.style.background = 'rgba(74,222,128,0.3)';
            b.style.border = '1.5px solid #4ade80';
            b.style.color = '#4ade80';
          } else {
            b.style.background = 'rgba(248,113,113,0.15)';
            b.style.border = '1.5px solid rgba(248,113,113,0.4)';
            b.style.color = 'rgba(255,255,255,0.35)';
          }
        });

        const feedback = document.getElementById('pk-feedback');
        if (isCorrect) {
          pkScore++; pkStreak++;
          feedback.textContent = pkStreak >= 3 ? `🔥 ${pkStreak} in a row!` : ' Correct!';
          feedback.style.color = '#4ade80';
          flashModal('rgba(74,222,128,0.15)');
        } else {
          pkStreak = 0;
          feedback.textContent = 'Wrong!';
          feedback.style.color = '#f87171';
          flashModal('rgba(248,113,113,0.15)');
        }

        updateScoreboard();
        document.getElementById('pk-next-btn').style.display = 'inline-block';
      }

      function flashModal(color) {
        const flash = document.getElementById('pk-flash');
        flash.style.background = color;
        flash.style.opacity = '1';
        setTimeout(() => flash.style.opacity = '0', 250);
      }

      function updateScoreboard() {
        document.getElementById('pk-score-display').innerHTML = `Score: <b style="color:#4ade80;">${pkScore}</b>`;
        document.getElementById('pk-streak-display').innerHTML = `Streak: <b style="color:#fb923c;">${pkStreak}</b>`;
      }

      function resetPokemonGame() {
        pkScore = 0; pkStreak = 0; pkSeen.clear();
        updateScoreboard();
        nextPokemon();
      }

      function openPokemonModal() {
        const modal = document.getElementById('pokemon-modal');
        modal.style.opacity = '0';
        modal.style.transition = 'opacity 0.4s ease';
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        if (!pkAnswered && !document.getElementById('pk-choices').children.length) {
          nextPokemon();
        }
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            modal.style.opacity = '1';
          });
        });
      }

      function closePokemonModal(event) {
        // If triggered by overlay click, only close when clicking the overlay itself
        if (event && event.target !== document.getElementById('pokemon-modal')) return;
        const modal = document.getElementById('pokemon-modal');
        modal.style.opacity = '0';
        setTimeout(() => {
          modal.style.display = 'none';
          document.body.style.overflow = '';
          // Wipe everything so next open is a completely fresh game
          pkScore = 0; pkStreak = 0; pkSeen.clear(); pkAnswered = false;
          updateScoreboard();
          document.getElementById('pk-choices').innerHTML = '';
          document.getElementById('pk-feedback').textContent = '';
          document.getElementById('pk-next-btn').style.display = 'none';
          document.getElementById('pk-sprite').src = '';
        }, 400);
      }
    </script>

  </div>

<img id="pikachu-follower"
src="assets/for_web/pikachu_anim.gif"
style="
position:fixed;
width:96px;
left:200px;
top:200px;
pointer-events:none;
display:none;
image-rendering:pixelated;
z-index:9999;
">

<script>

const pika = document.getElementById("pikachu-follower")

const idleRadius = 120

let mouse = {x:0,y:0}
let pos = {x:200,y:200}
let vel = {x:0,y:0}

let active = false
let facingRight = true
let currentState = "run"

const maxSpeed = 1
const accel = 0.01
const friction = 0.9

const runSprite = "assets/for_web/pikachu_anim.gif"
const idleSprite = "assets/for_web/pickahu_idle.gif"
const verticalSprite = "assets/for_web/pikachu_top.gif"

document.addEventListener("mousemove",e=>{
mouse.x = e.clientX
mouse.y = e.clientY
})

function updatePikachu(){

if(!active) return

let dx = mouse.x - pos.x
let dy = mouse.y - pos.y

let dist = Math.sqrt(dx*dx + dy*dy)

if(dist > 5){
vel.x += (dx/dist) * accel
vel.y += (dy/dist) * accel
}else{
vel.x *= friction
vel.y *= friction
}

vel.x = Math.max(-maxSpeed,Math.min(maxSpeed,vel.x))
vel.y = Math.max(-maxSpeed,Math.min(maxSpeed,vel.y))

pos.x += vel.x
pos.y += vel.y

pika.style.left = pos.x + "px"
pika.style.top = pos.y + "px"

if(dist < idleRadius){

vel.x *= 0.7
vel.y *= 0.7

if(currentState !== "idle"){
pika.src = idleSprite
currentState = "idle"
}

}else{

if(Math.abs(vel.y) > Math.abs(vel.x)){

if(currentState !== "vertical"){
pika.src = verticalSprite
currentState = "vertical"
}

pika.style.transform = "scaleX(1)"

}else{

if(currentState !== "run"){
pika.src = runSprite
currentState = "run"
}

if(vel.x > 0 && !facingRight){
pika.style.transform = "scaleX(1)"
facingRight = true
}

if(vel.x < 0 && facingRight){
pika.style.transform = "scaleX(-1)"
facingRight = false
}

}

}

requestAnimationFrame(updatePikachu)

}

function togglePikachu(){

active = !active

if(active){
pika.style.display = "block"
updatePikachu()
}else{
pika.style.display = "none"
}

}

document.addEventListener("keydown",e=>{
if(e.shiftKey && e.key === "P"){
togglePikachu()
}
})

let secret = ""
const code = "pikachu"

document.addEventListener("keydown",e=>{

secret += e.key.toLowerCase()

if(secret.length > code.length){
secret = secret.slice(-code.length)
}

if(secret === code){
togglePikachu()
secret = ""
}

})

</script>
